# Vitrail's terminal configuration.
#
# Imported and adapted: the palette now comes from
# `vitrail colors`, and the tab bar settings from ~/.config/vitrail.
#
# ~/.config/kitty is a symlink to this directory (see lib/zsh.sh), so the
# terminal is edited in the repo and reads its config from there live — the same
# "edit in the repo, runs live" approach hypr/ and zsh/ use.
#
# Colours come from colors-light.conf / colors-dark.conf, which matugen
# generates from the same wallpaper extraction that produces the Astal shell's
# stylesheet and the prompt's palette, so the three cannot drift apart. They are
# gitignored; this file is the tracked source of the settings around it.

# --- the generated palette ---------------------------------------------------
# Which of the two is shown is the Terminal page's colour scheme (following the
# desktop's light/dark, or pinned to one), resolved by the shell into
# ~/.config/vitrail/kitty-tabs.conf, which the settings page writes; the shell
# then signals kitty to reload. The plain include before it is only the
# fallback for a machine where the shell has never run: kitty applies both, the
# later one wins. `include` resolves relative to this file. Missing is fine —
# kitty falls back to its own defaults until scripts/set-wallpaper.sh has run.
# Shipped fallback first, then the generated palette (the later one wins).
include vitrail-colors-default.conf
include ~/.config/vitrail/kitty-colors.conf
# Nerd Font is not optional here: the prompt in zsh/theme/ is drawn with glyphs
# from the private use area (distribution logos, git counters, runtime marks),
# and a font without them renders every one as a box. All 28 code points the
# header uses are verified present in ttf-jetbrains-mono-nerd — see
# docs/terminal.md for the check to re-run after changing this line.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# The user's login shell, not the $SHELL kitty happened to be started with, so
# a terminal opened from the launcher's environment still gets zsh.
shell zsh
# Neither transparency nor blur is set here, on purpose: both are Hyprland's
# own decoration settings, controlled from Settings → Appearance → Windows.
# A `background_opacity` would multiply with the opacity Hyprland already
# applies to this window (leaving the terminal more transparent than every
# other one), and `background_blur` needs the KDE blur protocol, which
# Hyprland does not implement — the blur you see here is already Hyprland's.
# Colors.conf still supplies foreground/background for text that needs
# contrast (pager output, other programs' prompts).
remember_window_size  yes
initial_window_width  120
initial_window_height 32
hide_window_decorations no
window_padding_width  6
confirm_os_window_close -1

# --- cursor ------------------------------------------------------------------
# A beam reads better against the prompt's flat Material colours than a block.
# The colour itself is colors.conf's `cursor`. Note this version's names:
# `cursor_shape`, not `cursor_style`; `cursor_beam_thickness`, not
# `cursor_beam_width`; `cursor_blink_interval`, not `cursor_blink`.
cursor_shape          beam
cursor_beam_thickness 2
cursor_blink_interval -1
cursor_stop_blinking_after 0
# keep a pager for long output; the prompt's colours apply to it too
scrollback_pager        less
scrollback_lines        10000
wheel_scroll_multiplier 3.0
# `tab_bar_edge`, not `tab_bar`: this version moved the position into it.
# `custom` draws kitty/tab_bar.py's capsules; the bar itself is left to the
# terminal background so only the pills show.
tab_bar_edge   top
tab_bar_style  custom
tab_bar_margin_width 4.0
tab_bar_margin_height 4.0 2.0
tab_bar_min_tabs 1
# Edge, alignment and the "+" button, written by the Terminal settings page;
# it overrides the defaults above and is simply absent on a fresh clone.
# Written by the settings panel (Terminal page). Missing until it runs.
include ~/.config/vitrail/kitty-user.conf
active_tab_font_style   bold
inactive_tab_font_style normal
# New tab where the user actually is, instead of in the directory kitty was
# started in. This is kitty's own focused-window variant (it also puts the tab
# in the session the current tab belongs to). The tab bar's "+" button cannot
# be remapped — its action is hardcoded to the plain variant — so it opens in
# the directory the terminal was started in, which the shell sets to `~`
# (shell/src/lib/desktop-entry.ts's `entryBaseDirectory`).
map kitty_mod+t new_tab_with_cwd
# The prompt emits OSC 8 hyperlinks for the directory and the branch (see
# zsh/theme/segments/links.zsh); these control how kitty shows and opens them.
# url_color stays in colors.conf, generated from the wallpaper.
url_style      curly
open_url_with  default
mouse_hide_wait 3.0
