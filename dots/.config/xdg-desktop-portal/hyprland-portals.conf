# Overrides xdg-desktop-portal-hyprland's own hyprland-portals.conf: a user
# file of this name wins, so the compositor keeps its Screenshot, ScreenCast
# and GlobalShortcuts through `default`, and every open/save dialog is drawn by
# Phosh's GTK 4 chooser instead of the GTK 3 one. `gtk` is the fallback when
# the backend is not installed. GTK 3 apps reach it through GTK_USE_PORTAL=1
# (hyprland.lua).
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=phrosh;gtk
