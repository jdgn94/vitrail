#!/usr/bin/nft -f

# /etc/nftables.conf
#
# Additive full-tunnel rules for the Hypraether Domain-Based VPN.
# (Mode B / "full": everything goes through the VPN except a list of
# excluded domains.)
#
# IMPORTANT: this ruleset is deliberately *additive*: it does not set any
# DROP policy and does not interfere with Docker or any other firewall.
# The original Manjaro/Arch firewall ruleset, if any, is preserved untouched
# at /etc/nftables.conf.orig by the installer.
#
# How it works (inverted split tunnel):
#   1. dnsmasq (NetworkManager) resolves the EXCLUDED domains and populates
#      the bypass_ips / bypass_ips6 sets (see
#      /etc/NetworkManager/dnsmasq.d/vpn-mode.conf).
#   2. The "route" hook output chains below mark EVERY IPv4 packet with
#      fwmark 0x4555 (into the tunnel), then CLEAR the mark for packets to
#      an excluded IP (those stay on the normal route). IPv6 is accepted
#      only for excluded IPs and rejected otherwise — the tunnel is IPv4
#      only, so non-excluded IPv6 falls back to IPv4/tunnel.
#   3. Policy routing (see /etc/hypraether/vpn/vpn-up.sh) sends fwmark
#      0x4555 traffic through the "vpn" routing table, whose default route
#      is the OpenVPN tunnel. Unmarked (excluded) traffic uses the main
#      table and stays direct.

table ip vpn_split {
  set bypass_ips {
    type ipv4_addr
    flags interval
  }

  chain split_mark {
    type route hook output priority mangle
    meta mark set 0x4555
    ip daddr @bypass_ips meta mark set 0x0
  }
}

table ip6 vpn_split {
  set bypass_ips6 {
    type ipv6_addr
    flags interval
  }

  chain split_mark {
    type route hook output priority mangle
    ip6 daddr @bypass_ips6 accept
    reject with icmpv6 type admin-prohibited
  }
}

# SNAT to the tunnel IP is managed dynamically by /etc/hypraether/vpn/vpn-up.sh.
# The chain exists here only so nftables.service has a stable definition;
# the actual rule is flushed and re-added on every tunnel (re)connect.
table ip vpn_nat {
  chain postrouting {
    type nat hook postrouting priority srcnat
  }
}
