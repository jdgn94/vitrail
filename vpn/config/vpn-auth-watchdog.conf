# /etc/vpn-auth-watchdog.conf
#
# Desktop user that should receive AUTH_FAILED notifications and have the
# Proton dashboard opened for them. The watchdog daemon runs as root and
# uses this to reach the graphical session via runuser.
#
# Populated by install.sh with the user that ran the installer (SUDO_USER).

NOTIFY_USER=
NOTIFY_UID=
