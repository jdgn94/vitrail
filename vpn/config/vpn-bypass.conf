# /etc/NetworkManager/dnsmasq.d/vpn-mode.conf
#
# Domain -> nftables set mapping for FULL-TUNNEL mode: everything goes
# through the VPN except the domains listed below.
#
# Every time dnsmasq answers a DNS query for one of these domains, it
# resolves the domain (plus all of its subdomains) and inserts the resulting
# IPs into the matching nftables set (bypass_ips for IPv4, bypass_ips6 for
# IPv6). Traffic to those IPs is un-marked by /etc/nftables.conf and stays
# on the normal (direct) route; everything else goes through the tunnel.
#
# The list starts EMPTY = pure full tunnel. To exclude a domain (route it
# directly instead of through the VPN), add it to both nftset lines and
# restart NetworkManager (dnsmasq will pick up the new config). For example:
#   nftset=/my-bank.example/4#ip#vpn_split#bypass_ips
#   nftset=/my-bank.example/6#ip6#vpn_split#bypass_ips6

nftset=/4#ip#vpn_split#bypass_ips
nftset=/6#ip6#vpn_split#bypass_ips6

# Upstream resolvers (fallback). NetworkManager also supplies the per-interface
# servers from DHCP, so these only kick in as a last resort.
server=8.8.8.8
server=1.1.1.1
server=8.8.4.4
