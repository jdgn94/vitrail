#!/usr/bin/nft -f

# /etc/nftables.conf
#
# Additive split-tunnel rules for the Arch Domain-Based VPN.
#
# IMPORTANT: this ruleset is deliberately *additive*: it does not set any
# DROP policy and does not interfere with Docker or any other firewall.
# The original Manjaro/Arch firewall ruleset, if any, is preserved untouched
# at /etc/nftables.conf.orig by the installer.
#
# How it works:
#   1. dnsmasq (NetworkManager) resolves the target domains and populates the
#      vpn_ips / vpn_ips6 sets (see /etc/NetworkManager/dnsmasq.d/vpn-split.conf).
#   2. The "route" hook output chains below mark matching packets with fwmark
#      0x4555 (IPv4) or reject them outright (IPv6, forcing fallback to IPv4).
#   3. Policy routing (see /etc/vitrail/vpn/vpn-up.sh) sends fwmark 0x4555
#      traffic through the "vpn" routing table, whose default route is the
#      OpenVPN tunnel.

table ip vpn_split {
  set vpn_ips {
    type ipv4_addr
    flags interval
  }

  chain split_mark {
    type route hook output priority mangle
    ip daddr @vpn_ips meta mark set 0x4555
  }
}

table ip6 vpn_split {
  set vpn_ips6 {
    type ipv6_addr
    flags interval
  }

  chain split_mark {
    type route hook output priority mangle
    ip6 daddr @vpn_ips6 reject with icmpv6 type admin-prohibited
  }
}

# SNAT to the tunnel IP is managed dynamically by /etc/vitrail/vpn/vpn-up.sh.
# The chain exists here only so nftables.service has a stable definition;
# the actual rule is flushed and re-added on every tunnel (re)connect.
table ip vpn_nat {
  chain postrouting {
    type nat hook postrouting priority srcnat
  }
}
