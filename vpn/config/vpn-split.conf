# /etc/NetworkManager/dnsmasq.d/vpn-split.conf
#
# Domain -> nftables set mapping for the split tunnel.
#
# Every time dnsmasq answers a DNS query for one of these domains, it resolves
# the domain (plus all of its subdomains) and inserts the resulting IPs into
# the matching nftables set (vpn_ips for IPv4, vpn_ips6 for IPv6).
#
# Traffic destined to those IPs is then marked by /etc/nftables.conf and sent
# through the OpenVPN tunnel via policy routing.
#
# To tunnel more services, just append more domains to the nftset lines below
# and restart NetworkManager (dnsmasq will pick up the new config).

nftset=/anthropic.com/openai.com/chatgpt.com/claude.ai/oaistatic.com/oaiusercontent.com/auth0.com/4#ip#vpn_split#vpn_ips
nftset=/anthropic.com/openai.com/chatgpt.com/claude.ai/oaistatic.com/oaiusercontent.com/auth0.com/6#ip6#vpn_split#vpn_ips6

# Upstream resolvers (fallback). NetworkManager also supplies the per-interface
# servers from DHCP, so these only kick in as a last resort.
server=8.8.8.8
server=1.1.1.1
server=8.8.4.4
