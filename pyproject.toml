[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitrail"
version = "0.1.0"
description = "Dotfiles and desktop layer for Arch Linux, across Wayland compositors"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vitrail = "vitrail.cli:main"

[tool.setuptools]
packages = ["vitrail"]

[dependency-groups]
dev = [
    "graphifyy>=0.9.97",
]
